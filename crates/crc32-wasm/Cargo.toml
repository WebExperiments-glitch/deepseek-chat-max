[package]
name = "crc32-wasm"
version = "0.1.0"
edition = "2021"
description = "ZIP CRC32 (IEEE 802.3) compiled to a dependency-free WASM module for chat-demo's archive importer."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
miniz_oxide = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
