name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（如 v0.1.2）'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# 打 tag（或手动指定 tag）时自动建 GitHub Release，并附上两种构建产物：
# - static 包：纯静态托管用（数据存浏览器 IndexedDB）
# - local 包：本机 Node+SQLite 模式用
# Release 正文由 CHANGELOG / tag 说明决定，这里不编造版本号。
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.26.2

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Quality gate
        run: |
          node scripts/review-gate.mjs
          pnpm type && pnpm lint && pnpm test && pnpm test:server

      - name: Build local mode
        run: pnpm build
      - name: Package local build
        run: cd dist && zip -qr ../deepseek-chat-max-local.zip .

      - name: Build static mode
        run: pnpm build:static
      - name: Package static build
        run: cd dist && zip -qr ../deepseek-chat-max-static.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            deepseek-chat-max-local.zip
            deepseek-chat-max-static.zip
          draft: false
          prerelease: false
