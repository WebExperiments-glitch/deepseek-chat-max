name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.26.2

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 静态审计闸门：密钥/私钥扫描、核心层平台依赖、错误脱敏、CI 权限。
      # 与本地 pre-push 共用同一份脚本，本地绿 = CI 绿。
      - name: Static review gate
        run: node scripts/review-gate.mjs

      - name: Type check
        run: pnpm type

      - name: Lint
        run: pnpm lint

      # 单元测试与本机服务（DB + 安全）测试是 README 质量门禁的一部分，必须在 CI 真跑。
      - name: Unit tests (Vitest)
        run: pnpm test

      - name: Server tests (SQLite + security)
        run: pnpm test:server

      - name: Build
        run: pnpm build

  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.26.2

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 依赖漏洞审计只在高危(high+)时失败；pnpm audit 在 CI 官方 registry 下可用，
      # 本机国内镜像通常不实现 audit 接口——所以这条只在 CI 跑。
      - name: Dependency audit (high+)
        run: pnpm audit --audit-level high --prod
