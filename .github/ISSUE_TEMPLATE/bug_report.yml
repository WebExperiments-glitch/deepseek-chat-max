name: Bug 报告
description: 报告一个可复现的问题
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先确认不是重复 issue。**不要贴 API Key / token / 私钥**。
  - type: dropdown
    id: mode
    attributes:
      label: 运行模式
      description: 本机模式（Node+SQLite）还是静态模式（浏览器 IndexedDB）
      options:
        - 本机模式 (pnpm dev / pnpm start)
        - 静态模式 (pnpm build:static)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      description: package.json 的 version，或页面 meta application-version
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 现象
      description: 发生了什么、期望是什么
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 最小复现路径
      placeholder: |
        1. 打开设置 → 模型
        2. 选择 xxx
        3. 看到 xxx
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志 / 控制台
      description: 浏览器控制台或本地服务日志（脱敏后）
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: 自检
      options:
        - label: 已搜索过现有 issue
          required: true
        - label: 没有在报告里包含密钥或隐私数据
          required: true
