# CodeQL 分析范围：只聚焦会进入产品/运行时的代码，排除开发期与实验性目录。
#
# 关键约束（不要改）：src/** 是前端运行时代码，server/** 是 Node 本机服务运行时代码，
# 两者都是本项目的核心攻击面，必须被扫描，因此绝不能写进下面的 paths-ignore。
name: 'CodeQL 配置：聚焦产品代码'

paths-ignore:
  # 开发/运维一次性脚本（构建、验证、爬虫、截图等）：不进入构建产物，也不随服务运行，
  # 其中大量 URL/命令拼接容易产生与产品安全无关的误报。
  - scripts/**
  # 调研/实验草稿目录：非产品代码，随时可能删除，扫描它们没有收益。
  - _research/**
  # 原生模块实验目录：当前未参与构建；若将来接入构建，记得从这里移除。
  - crates/**
